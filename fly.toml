# fly.toml app configuration file generated for pepper-carrot-ai-flipbook-workshop on 2026-05-31T18:26:03-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pepper-carrot-ai-flipbook-workshop'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

# Restore the baked seed into a fresh Neon DB in a temporary release machine,
# BEFORE the app machine boots. Idempotent (skips if the DB is already seeded).
# Keeping the restore out of the app boot path is what lets uvicorn bind
# 0.0.0.0:8000 immediately, so Fly's listen check never races a slow first
# boot. The value "seed" is appended to the image ENTRYPOINT → the release
# machine runs `/app/entrypoint.sh seed`.
[deploy]
  release_command = 'seed'

[env]
  CHAT_PROVIDER = 'ollama'
  EMBEDDING_MODEL = 'bge-m3'
  EMBEDDING_PROVIDER = 'ollama'
  LOG_LEVEL = 'INFO'
  OLLAMA_CHAT_MODEL = 'qwen2.5:7b'
  STORAGE_BACKEND = 'r2'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep ONE machine always warm so the first request after idle (the picker's
  # /api/episodes call) doesn't pay a wake-from-zero cold start. The second
  # machine still auto-stops when idle and both scale up under load. Trade-off:
  # ~$2-4/mo for the always-on 512 MB machine instead of $0 idle — the
  # deliberate other side of the scale-to-zero choice. Set back to 0 for $0 idle.
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  # Readiness signal for fly-proxy. On a wake-from-zero, the proxy uses this to
  # tell when /health answers, so it waits for the app to be ready instead of
  # forwarding into a not-yet-bound socket ("[PC01] instance refused
  # connection"). grace_period covers the brief startup before the first probe.
  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '15s'
    timeout = '5s'
    # 30s, not 10s: a wake-from-zero cold start (Firecracker VM boot + Python
    # start) takes ~10s, which brushed the old 10s grace and made the check
    # flap on every deploy ("Health check ... has failed"). 30s clears the
    # cold start comfortably. A check showing "warning: machine hasn't started"
    # while idle is normal for a scale-to-zero app — the check can't run on a
    # stopped machine; the next request wakes it and it passes.
    grace_period = '30s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
