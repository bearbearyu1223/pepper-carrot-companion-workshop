# fly.toml app configuration file generated for peppercarrot-companion-mellowed-field-3227 on 2026-05-31T17:08:14-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'peppercarrot-companion-mellowed-field-3227'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CHAT_PROVIDER = 'ollama'
  EMBEDDING_MODEL = 'bge-m3'
  EMBEDDING_PROVIDER = 'ollama'
  LOG_LEVEL = 'INFO'
  OLLAMA_CHAT_MODEL = 'qwen2.5:7b'
  STORAGE_BACKEND = 'r2'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
